[project]
name = "proyecto-2025a"
version = "0.1.0"
description = "Framework for the Minimal Information Partition problem."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "manim>=0.19.0",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyinstrument>=5.1.2",
    "pyphi>=1.2.0",
    "pyttsx3>=2.99",
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
# Lógica: Agrega el directorio raíz del proyecto al sys.path para que `from src.xxx import yyy` funcione.
# Sintaxis: `pythonpath = ["."]` — pytest añade "." (Method2_Dynamic_Programming_Reformulation/) al path.
pythonpath = ["."]
# Lógica: Indica a pytest dónde buscar los tests.
# Sintaxis: Lista de directorios relativos al pyproject.toml.
testpaths = ["tests"]
# Lógica: Muestra los valores de los print() dentro de los tests (útil para los reportes de tiempo).
# Sintaxis: `-s` suprime la captura de stdout; `--tb=short` muestra trazas de error compactas.
addopts = "-v --tb=short"
